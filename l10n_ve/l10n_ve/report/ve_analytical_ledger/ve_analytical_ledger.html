<style>
    @media print {
        @page {
            size: landscape;
            margin: 8mm 12mm 8mm 12mm;
        }
        .page-container {
            page-break-after: always;
        }
        .page-container:last-child {
            page-break-after: avoid;
        }
    }
    
    body {
        font-family: "Outfit", "Inter", "Helvetica Neue", Arial, sans-serif;
        color: #1a1a1a;
        font-size: 10px;
        background-color: #fff;
        margin: 0;
        padding: 0;
    }
    
    .page-container {
        background-color: #fff;
        padding: 10px;
        box-sizing: border-box;
    }
    
    .report-header {
        width: 100%;
        margin-bottom: 5px;
        border-collapse: collapse;
    }
    
    .report-header td {
        border: none;
        padding: 2px 0;
    }
    
    .company-title {
        font-size: 13px;
        font-weight: bold;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    
    .report-title-container {
        text-align: center;
        margin-bottom: 12px;
        margin-top: -10px;
    }
    
    .report-title {
        font-size: 14px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #000;
    }
    
    .meta-line {
        font-size: 10px;
        font-weight: 500;
        margin-top: 3px;
        color: #333;
    }
    
    .account-group-header {
        font-size: 11px;
        font-weight: bold;
        margin-top: 15px;
        margin-bottom: 8px;
        border-bottom: 2px solid #000;
        padding-bottom: 4px;
        display: flex;
    }
    
    .account-code {
        width: 25%;
    }
    
    .account-desc {
        width: 75%;
    }
    
    .ledger-table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 2px;
    }
    
    .ledger-table th {
        font-size: 10px;
        font-weight: bold;
        border-bottom: 1.5px solid #000;
        border-top: 1.5px solid #000;
        padding: 5px 3px;
        text-align: left;
        text-transform: uppercase;
    }
    
    .ledger-table td {
        padding: 4px 3px;
        vertical-align: top;
        line-height: 1.25;
        border-bottom: 1px solid #f0f0f0;
    }
    
    .text-right {
        text-align: right;
    }
    
    .text-center {
        text-align: center;
    }
    
    .bold {
        font-weight: bold;
    }
    
    .double-line-second {
        font-size: 8.5px;
        color: #444;
        font-weight: normal;
        margin-top: 2px;
    }
    
    .totals-row td {
        border-top: 1.5px solid #000;
        border-bottom: 2px double #000;
        font-weight: bold;
        background-color: #fafafa;
        padding: 6px 3px;
    }
    
    .van-vienen-row td {
        border-top: 1.5px solid #000;
        border-bottom: 1.5px solid #000;
        font-weight: bold;
        font-style: italic;
        background-color: #f5f5f5;
        padding: 5px 3px;
    }
</style>

<div id="ledger-report-container"></div>

<script>
(function() {
    var filters = {{ filters | json }};
    var data = {{ data | json }};
    
    var company_name = filters.company || "";
    var company_rif = "";
    if (data && data.length > 0) {
        for (var idx = 0; idx < data.length; idx++) {
            var row = data[idx];
            if (row.company_rif) {
                company_rif = row.company_rif;
                break;
            }
        }
    }
    var from_date = filters.from_date || "";
    var to_date = filters.to_date || "";
    
    // Agrupar filas planas en estructura jerárquica por cuenta
    var accounts = [];
    var currentAccount = null;
    
    for (var idx = 0; idx < data.length; idx++) {
        var row = data[idx];
        if (row.is_header) {
            currentAccount = {
                number: row.account_number,
                name: row.account_name,
                opening_balance: 0.0,
                entries: [],
                total_debit: 0.0,
                total_credit: 0.0,
                final_balance: 0.0
            };
            accounts.push(currentAccount);
        } else if (row.is_opening) {
            if (currentAccount) {
                currentAccount.opening_balance = row.balance;
            }
        } else if (row.is_total) {
            if (currentAccount) {
                currentAccount.total_debit = row.debit;
                currentAccount.total_credit = row.credit;
                currentAccount.final_balance = row.balance;
            }
        } else if (row.is_spacer) {
            // Ignorar espaciadores
        } else {
            if (currentAccount) {
                currentAccount.entries.push(row);
            }
        }
    }
    
    // Formateadores estándar
    function formatCurrency(val) {
        if (val === undefined || val === null || isNaN(val)) return "0,00";
        var formatted = Math.abs(val).toFixed(2)
            .replace('.', ',')
            .replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.');
        if (val < 0) {
            return "(" + formatted + ")";
        }
        return formatted;
    }
    
    function formatDate(dateStr) {
        if (!dateStr) return "";
        var parts = dateStr.split('-');
        if (parts.length === 3) {
            return parts[2] + "/" + parts[1] + "/" + parts[0].slice(-2);
        }
        return dateStr;
    }
    
    function getTodayDateTime() {
        var now = new Date();
        var day = ("0" + now.getDate()).slice(-2);
        var month = ("0" + (now.getMonth() + 1)).slice(-2);
        var year = now.getFullYear();
        var hours = now.getHours();
        var minutes = ("0" + now.getMinutes()).slice(-2);
        var ampm = hours >= 12 ? 'p.m.' : 'a.m.';
        hours = hours % 12;
        hours = hours ? hours : 12;
        return "Emitido el " + day + "/" + month + "/" + year + " a las " + hours + ":" + minutes + " " + ampm;
    }

    var emit_time = getTodayDateTime();
    var container = document.getElementById("ledger-report-container");
    var html = "";
    var global_page_num = 1;
    
    // Definir filas físicas por página (horizontal)
    var rows_per_page = 14; 
    
    for (var a_idx = 0; a_idx < accounts.length; a_idx++) {
        var acc = accounts[a_idx];
        var entries = acc.entries;
        var total_pages = Math.max(1, Math.ceil(entries.length / rows_per_page));
        
        var running_bal = acc.opening_balance;
        var page_cum_debit = 0.0;
        var page_cum_credit = 0.0;
        
        for (var p = 0; p < total_pages; p++) {
            var start = p * rows_per_page;
            var end = Math.min(start + rows_per_page, entries.length);
            var page_entries = entries.slice(start, end);
            
            // Totales específicos de esta página física
            var page_debit_sum = 0.0;
            var page_credit_sum = 0.0;
            for (var pe_idx = 0; pe_idx < page_entries.length; pe_idx++) {
                var ent = page_entries[pe_idx];
                page_debit_sum += ent.debit;
                page_credit_sum += ent.credit;
            }
            
            page_cum_debit += page_debit_sum;
            page_cum_credit += page_credit_sum;
            
            html += '<div class="page-container">';
            
            // Membrete del reporte
            html += '<table class="report-header">' +
                    '<tr>' +
                        '<td style="width: 40%; line-height: 1.35; vertical-align: top;">' +
                            '<div class="company-title">' + company_name + '</div>' +
                            '<div class="bold">RIF: ' + company_rif + '</div>' +
                        '</td>' +
                        '<td style="width: 20%;"></td>' +
                        '<td style="width: 40%; text-align: right; vertical-align: top; line-height: 1.35;">' +
                            '<div>Pág. ' + global_page_num + '</div>' +
                            '<div style="font-size: 8px; color: #555;">' + emit_time + '</div>' +
                        '</td>' +
                    '</tr>' +
                '</table>' +
                '<div class="report-title-container">' +
                    '<div class="report-title">Mayor Analítico</div>' +
                    '<div class="meta-line">Desde el ' + formatDate(from_date) + ' hasta el ' + formatDate(to_date) + '</div>' +
                '</div>' +
                '<div class="account-group-header">' +
                    '<span class="account-code">Código: <span class="bold" style="font-size: 12px; font-family: monospace;">' + acc.number + '</span></span>' +
                    '<span class="account-desc">Descripción: <span class="bold" style="font-size: 11px;">' + acc.name + '</span></span>' +
                '</div>' +
                '<table class="ledger-table">' +
                    '<thead>' +
                        '<tr>' +
                            '<th style="width: 8%;">Fecha</th>' +
                            '<th style="width: 14%;">Número de Comprob.</th>' +
                            '<th style="width: 10%;">Aux.</th>' +
                            '<th style="width: 8%;">Ref.</th>' +
                            '<th style="width: 32%;">Descripción / Glosa</th>' +
                            '<th style="width: 10%; text-align: right;">Monto Debe</th>' +
                            '<th style="width: 10%; text-align: right;">Monto Haber</th>' +
                            '<th style="width: 10%; text-align: right;">Saldo</th>' +
                            '<th style="width: 8%; text-align: center;">Fecha Asiento</th>' +
                        '</tr>' +
                    '</thead>' +
                    '<tbody>';
            
            // Fila de saldo inicial / arrastre
            if (p === 0) {
                html += '<tr>' +
                        '<td style="font-size: 9px; font-weight: bold;">' + formatDate(from_date) + '</td>' +
                        '<td class="bold" style="font-size: 9px;">SALDO INICIAL</td>' +
                        '<td></td>' +
                        '<td></td>' +
                        '<td></td>' +
                        '<td class="text-right">0,00</td>' +
                        '<td class="text-right">0,00</td>' +
                        '<td class="text-right bold">' + formatCurrency(acc.opening_balance) + '</td>' +
                        '<td class="text-center" style="font-size: 9px; font-weight: bold;">' + formatDate(from_date) + '</td>' +
                    '</tr>';
            } else {
                html += '<tr class="van-vienen-row">' +
                        '<td></td>' +
                        '<td class="bold">VIENEN:</td>' +
                        '<td></td>' +
                        '<td></td>' +
                        '<td>Arrastre de folio anterior</td>' +
                        '<td class="text-right">' + formatCurrency(page_cum_debit - page_debit_sum) + '</td>' +
                        '<td class="text-right">' + formatCurrency(page_cum_credit - page_credit_sum) + '</td>' +
                        '<td class="text-right">' + formatCurrency(running_bal) + '</td>' +
                        '<td></td>' +
                    '</tr>';
            }
            
            // Renderizar transacciones
            for (var e_idx = 0; e_idx < page_entries.length; e_idx++) {
                var ent = page_entries[e_idx];
                running_bal += (ent.debit - ent.credit);
                
                // Formatear el Auxiliar (con prefijos de ceros)
                var padded_ref = ent.ref_code ? ("00000" + ent.ref_code).slice(-8) : "";
                
                html += '<tr>' +
                        '<td style="font-size: 9px; padding-top: 5px; font-family: monospace;">' + formatDate(ent.posting_date) + '</td>' +
                        '<td style="font-size: 9px; padding-top: 5px;" class="bold">' +
                            ent.voucher_no +
                            '<div class="double-line-second" style="font-family: monospace;">' + (ent.party || "") + '</div>' +
                        '</td>' +
                        '<td style="font-size: 9px; padding-top: 5px;">' +
                            padded_ref +
                            '<div class="double-line-second" style="font-family: monospace;">' + (ent.party || "") + '</div>' +
                        '</td>' +
                        '<td style="font-size: 9px; padding-top: 5px; font-family: monospace;">' + ent.ref_code + '</td>' +
                        '<td style="font-size: 9px; padding-top: 5px; line-height: 1.2;">' +
                            (ent.remarks || "") +
                            (ent.party_name ? '<span style="font-style: italic; color: #555;"><br>Tercero: ' + ent.party_name + '</span>' : "") +
                        '</td>' +
                        '<td class="text-right" style="padding-top: 5px; font-family: monospace;">' + formatCurrency(ent.debit) + '</td>' +
                        '<td class="text-right" style="padding-top: 5px; font-family: monospace;">' + formatCurrency(ent.credit) + '</td>' +
                        '<td class="text-right bold" style="padding-top: 5px; font-family: monospace;">' + formatCurrency(running_bal) + '</td>' +
                        '<td class="text-center" style="font-size: 9px; padding-top: 5px; font-family: monospace;">' + formatDate(ent.posting_date) + '</td>' +
                    '</tr>';
            }
            
            // Fila de cierre (VAN o TOTAL)
            if (p < total_pages - 1) {
                html += '<tr class="van-vienen-row">' +
                        '<td></td>' +
                        '<td class="bold">VAN:</td>' +
                        '<td></td>' +
                        '<td></td>' +
                        '<td>Suma para el siguiente folio</td>' +
                        '<td class="text-right">' + formatCurrency(page_cum_debit) + '</td>' +
                        '<td class="text-right">' + formatCurrency(page_cum_credit) + '</td>' +
                        '<td class="text-right">' + formatCurrency(running_bal) + '</td>' +
                        '<td></td>' +
                    '</tr>';
            } else {
                html += '<tr class="totals-row">' +
                        '<td></td>' +
                        '<td class="bold">TOTAL CUENTA:</td>' +
                        '<td></td>' +
                        '<td></td>' +
                        '<td>Acumulado del período</td>' +
                        '<td class="text-right">' + formatCurrency(acc.total_debit) + '</td>' +
                        '<td class="text-right">' + formatCurrency(acc.total_credit) + '</td>' +
                        '<td class="text-right bold">' + formatCurrency(acc.final_balance) + '</td>' +
                        '<td></td>' +
                    '</tr>';
            }
            
            html += '</tbody></table></div>';
            
            global_page_num++;
        }
    }
    
    container.innerHTML = html;
})();
</script>
