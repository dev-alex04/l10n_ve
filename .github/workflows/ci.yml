
name: CI

on:
  # Todo corre en el runner propio de Domina Testing 2 (ver domina-deploy/ci/README.md): los PR
  # hacia development y main, la nocturna y la manual. Ninguna prueba corre en máquinas de GitHub.
  pull_request:
    branches:
      - main
      - development
  schedule:
    - cron: '30 7 * * *'   # 03:30 Caracas: después del refresco de las bases (02:15)
  workflow_dispatch:

concurrency:
  # OJO: antes agrupaba por github.event.number, que en eventos que no son PR
  # viene VACÍO — todas esas corridas caían en el mismo grupo y se cancelaban
  # entre sí aunque fueran de cosas distintas.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    permissions:
      contents: read
    # Runner propio de Domina Testing 2 (etiqueta domina-ci): bench caliente con frappe y erpnext
    # fijos; por corrida restaura la base `ve`, copia este checkout y corre la suite. Ninguna
    # prueba corre en máquinas de GitHub (decisión del 12-sep-2026; ver domina-deploy/ci/README.md).
    # Solo ramas del propio repo: un runner propio ejecutando PRs de forks es un agujero de seguridad.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, domina-ci]
    name: Server
    timeout-minutes: 90
    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Suite en bench caliente
        id: tests
        run: |
          set -o pipefail
          /home/runner/ci-run.sh l10n_ve ve "$GITHUB_WORKSPACE" 2>&1 | tee /tmp/test_output.txt
        env:
          TYPE: server

      - name: Notify Telegram on Test Failure
        if: failure() && steps.tests.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
          PR_NUM: ${{ github.event.pull_request.number }}
          ACTOR_LOGIN: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Secrets de Telegram no configurados, omitiendo notificación."
            exit 0
          fi
          BRANCH="${HEAD_REF:-$REF_NAME}"
          TEST_OUTPUT=$(tail -40 /tmp/test_output.txt 2>/dev/null | head -c 2000)
          MESSAGE=$(printf "🔴 Tests FALLIDOS — l10n_ve\n👤 %s\n🌿 %s\n🔗 PR #%s\n\n%s\n\n%s" \
            "$ACTOR_LOGIN" "$BRANCH" "$PR_NUM" "$TEST_OUTPUT" "$RUN_URL")
          PAYLOAD=$(jq -n --arg chat_id "$TELEGRAM_CHAT_ID" --arg text "$MESSAGE" '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')
          curl -s -o /dev/null -w "Telegram HTTP: %{http_code}\n" -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" -H "Content-Type: application/json" -d "$PAYLOAD"
