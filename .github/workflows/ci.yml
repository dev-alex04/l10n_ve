
name: CI

on:
  # La suite pesada levanta un bench entero con MariaDB, Redis y cinco apps.
  # Ya no corre en cada push a development: eso, multiplicado por todos los
  # repos, daba 2.394 corridas al mes y agotó el presupuesto de Actions.
  #
  # Ahora corre donde importa —el release— y una vez por noche sobre
  # development, para que una regresión aparezca al día siguiente con los
  # commits de esa jornada y no en el release con treinta.
  #
  # Los PR hacia development los cubre el workflow de chequeos rápidos.
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  # OJO: antes agrupaba por github.event.number, que en eventos que no son PR
  # viene VACÍO — todas esas corridas caían en el mismo grupo y se cancelaban
  # entre sí aunque fueran de cosas distintas.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

      - uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Install MariaDB Client
        run: sudo apt-get install -y mariadb-client

      - name: Setup
        run: |
          pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --frappe-branch version-15 --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app erpnext --branch version-15
          bench get-app l10n_ve $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app erpnext
          bench --site test_site install-app l10n_ve
          bench build
        env:
          CI: 'Yes'

      - name: Run Tests
        id: tests
        working-directory: /home/runner/frappe-bench
        run: |
          set -o pipefail
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --app l10n_ve --skip-test-records 2>&1 | tee /tmp/test_output.txt
        env:
          TYPE: server

      - name: Notify Telegram on Test Failure
        if: failure() && steps.tests.outcome == 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⏭️  Secrets de Telegram no configurados, omitiendo notificación."
            exit 0
          fi

          APP_NAME="l10n_ve"
          BRANCH="${{ github.head_ref || github.ref_name }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          ACTOR="${{ github.actor }}"

          # Extraer últimas 40 líneas del output de tests (errores + resumen)
          if [ -f /tmp/test_output.txt ]; then
            TEST_OUTPUT=$(tail -40 /tmp/test_output.txt | head -c 2000)
          else
            TEST_OUTPUT="No se pudo capturar el output de los tests."
          fi

          MESSAGE=$(printf "🔴 Tests FALLIDOS — %s\n👤 %s\n🌿 Branch: %s\n🔗 PR: #%s\n\n📋 Output:\n\`\`\`\n%s\n\`\`\`\n\n🔍 %s" \
            "$APP_NAME" "$ACTOR" "$BRANCH" "$PR_NUMBER" "$TEST_OUTPUT" "$RUN_URL")

          PAYLOAD=$(jq -n \
            --arg chat_id "$TELEGRAM_CHAT_ID" \
            --arg text "$MESSAGE" \
            --arg parse_mode "Markdown" \
            '{chat_id: $chat_id, text: $text, parse_mode: $parse_mode, disable_web_page_preview: true}')

          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Telegram HTTP: ${HTTP_CODE}"
          if [ "$HTTP_CODE" != "200" ]; then
            # Reintentar sin Markdown si falla el parseo
            PAYLOAD_PLAIN=$(jq -n \
              --arg chat_id "$TELEGRAM_CHAT_ID" \
              --arg text "$MESSAGE" \
              '{chat_id: $chat_id, text: $text, disable_web_page_preview: true}')
            curl -s -o /dev/null \
              -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H "Content-Type: application/json" \
              -d "$PAYLOAD_PLAIN"
          fi
