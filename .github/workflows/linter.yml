name: Linters

on:
  pull_request:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: linters-l10n_ve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # El escaneo es diferencial: semgrep compara contra la base del PR y solo
          # reporta hallazgos NUEVOS. Sin el historial no puede calcular esa base y
          # escanearia todo, incluida la deuda previa.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Descargar las reglas de Frappe
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Correr semgrep
        run: |
          pip install semgrep
          # frappe-modifying-but-not-comitting-other-method ancla el hallazgo en la
          # linea del `class`, o sea que su huella abarca la clase ENTERA: cualquier
          # cambio adentro le cambia el texto al match y el escaneo diferencial lo
          # reporta como nuevo, aunque sea de siempre. Medido en l10n_ve#616, ocho de
          # los nueve hallazgos que lo bloqueaban eran esto.
          #
          # Y son falsos positivos: el `pattern-not` con el que la regla reconoce que
          # el campo SI se persiste exige la forma `db_set(..., self.$ATTR, ...)`, asi
          # que no reconoce `self.db_set("hka_status", "Pendiente")` --valor literal--
          # ni los shims que se setean en memoria a proposito antes de delegar al
          # super de ERPNext.
          #
          # La hermana `frappe-modifying-but-not-comitting` (sin sufijo) NO se excluye:
          # esa ancla en el metodo, no en la clase, y se comporta bien.
          semgrep ci \
            --config ./frappe-semgrep-rules/rules \
            --config r/python.lang.correctness \
            --config .semgrep \
            --exclude-rule frappe-semgrep-rules.rules.frappe-modifying-but-not-comitting-other-method
